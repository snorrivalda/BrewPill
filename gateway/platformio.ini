; BrewPill gateway: ESP32 that receives Brew Pill BLE broadcasts and forwards
; them over Wi-Fi to Brewfather and/or any JSON webhook.

[env:esp32dev]
platform = espressif32@6.13.0
board = esp32dev
framework = arduino
; BLE + Wi-Fi + HTTPS don't fit the default 1.2 MB app partition
board_build.partitions = huge_app.csv
monitor_speed = 115200
upload_port = /dev/cu.usbserial-0001
monitor_port = /dev/cu.usbserial-0001
build_flags = -Wall
